<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM Attendance Login</title>
    <link rel="icon" href="{{ url_for('static', filename='images/icon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
            position: relative;
        }

        /* BACKGROUND SHAPES */

        .circle {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* DIFFERENT CIRCLES */

        .c1 {
            width: 250px;
            height: 250px;
            top: 120px;
            left: 180px;
        }

        .c2 {
            width: 320px;
            height: 320px;
            top: 250px;
            left: 430px;
        }

        .c3 {
            width: 180px;
            height: 180px;
            top: 120px;
            left: 700px;
        }

        .c4 {
            width: 140px;
            height: 140px;
            bottom: 120px;
            left: 300px;
        }

        .c5 {
            width: 260px;
            height: 260px;
            top: 180px;
            right: 320px;
        }

        .c6 {
            width: 120px;
            height: 120px;
            bottom: 100px;
            right: 420px;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 40px;
            color: white;
            font-size: 40px;
            font-weight: 600;
        }

        /* LOGIN CARD */

        .login-box {
            position: absolute;
            top: 50%;
            right: 50px;
            transform: translateY(-50%);
            width: 300px;
            padding: 40px;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .login-box h2 {
            color: rgb(248, 244, 244);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* INPUTS */

        .input-box {
            margin-bottom: 20px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: rgb(4, 4, 4);
            font-size: 15px;
            
        }

        .input-box input::placeholder {
            color: #060505;
        }

        /* CAPTCHA */

        .captcha {
            height: 70px;
            border-radius: 12px;
            margin-bottom: 20px;

            background:
                repeating-linear-gradient(120deg,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.15) 2px,
                    transparent 2px,
                    transparent 20px);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #38bdf8;
        }

        /* BUTTONS */

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn {
            background: #2563eb;
            color: white;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* FOOTER */

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            opacity: 0.7;
        }

        /* GLOW EFFECTS */

        .blur {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
        }

        .blur1 {
            background: #2563eb;
            top: -100px;
            left: -100px;
        }

        .blur2 {
            background: #ec4899;
            bottom: -100px;
            right: -100px;
        }
    </style>
</head>

<body>

    <div class="blur blur1"></div>
    <div class="blur blur2"></div>

    <div class="logo">
        SAM Attendance System
    </div>

    <!-- BACKGROUND CIRCLES -->

    <div class="circle c1">Diploma</div>
    <div class="circle c2">CSE Final Sem</div>
    <div class="circle c3">2025</div>
    <div class="circle c4">SAM</div>
    <div class="circle c5">Attendance</div>
    <div class="circle c6">AI</div>

    <!-- LOGIN CARD -->

<div class="login-box">

<form action="/login" method="POST">

    <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
    </div>

    <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit" class="btn login-btn">
        Sign In
    </button>

</form>

</div>
    </div>

    <div class="footer">
        © 2026 SAM Global University Attendance System
    </div>

</body>

</html>
